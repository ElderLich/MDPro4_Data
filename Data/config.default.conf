# MDPro stock configuration. Release packages use this as Data/config.conf.
# Never package a developer's live config.conf: it contains account and progress data.
# Format: key->value. 1 = enabled, 0 = disabled, @ui = empty text.
# The first launch chooses the system interface language and asks for a player name.
# Card text starts in English; players can choose another card language in settings.
# Missing settings use the game's defaults and are added when needed.

# [01 Player and language]
DuelPlayerName0->Player
PlayerNameSetupComplete->0
CardLanguage->en-US

# [02 Duel]
DuelField0->1090001
DuelField1->1090001
DuelMate0->1000001
DuelMate1->1000001

# [06 Display and audio]
ShowFPS->0
