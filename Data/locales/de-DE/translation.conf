# Adventures / Puzzles and showcases
Activate Crossout Designator and declare Crossout Designator. If asked to choose the opponent's declaration, select Forbidden Droplet. Exit when you have finished viewing the demonstration.->Aktiviere „Auslöschungsinformant“ und deklariere „Auslöschungsinformant“. Falls du die Deklaration des Gegners wählen sollst, wähle „Verbotener Tropfen“. Beende die Vorführung, wenn du alles angesehen hast.
Activate Maxx "C" and let the opponent respond with Ash Blossom & Joyous Spring. After the Chain resolves, activate Triple Tactics Talent. Exit when you have finished viewing the demonstration.->Aktiviere „Maxx „C““ und lasse den Gegner mit „Aschenblüte & Freudiger Frühling“ reagieren. Aktiviere nach Auflösung der Kette „Talent der drei Taktiken“. Beende die Vorführung, wenn du alles angesehen hast.
Activate Maxx "C", then chain Ghost Belle & Haunted Mansion to the opponent's Called by the Grave. Exit when you have finished viewing the demonstration.->Aktiviere „Maxx „C““ und kette dann „Geistermädchen & Spukhaus“ an „Vom Grab gerufen“ des Gegners an. Beende die Vorführung, wenn du alles angesehen hast.
Activate Raigeki to clear the opponent's monsters, then attack directly with The Winged Dragon of Ra - Immortal Phoenix to win this turn.->Aktiviere „Raigeki“, um die Monster des Gegners zu beseitigen. Greife dann mit „Der geflügelte Drache von Ra - Unsterblicher Phönix“ direkt an, um in diesem Spielzug zu gewinnen.
Activate Raigeki to clear the opponent's monsters, then enter the Battle Phase and win this turn with a direct attack.->Aktiviere „Raigeki“, um die Monster des Gegners zu beseitigen. Gehe dann in die Battle Phase und gewinne in diesem Spielzug mit einem direkten Angriff.
Activate the featured card or its effect, then follow the selection prompts. This is a demonstration; exit when you have finished viewing it.->Aktiviere die vorgestellte Karte oder ihren Effekt und folge den Auswahlaufforderungen. Dies ist eine Vorführung; beende sie, wenn du alles angesehen hast.
Activate your Set Side Effects? and let the opponent draw, then activate Droll & Lock Bird. Exit when you have finished viewing the demonstration.->Aktiviere dein gesetztes „Nebenwirkungen?“ und lasse den Gegner ziehen. Aktiviere dann „Kauz & Schlossvogel“. Beende die Vorführung, wenn du alles angesehen hast.
