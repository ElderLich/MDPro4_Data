# Online / SRVPro notices and tips
Card dealer: Hakimi Mambo~->Kartengeberin: Hakimi Mambo~
Card dealer: Sigh, I still haven't met today's brick-hand quota. Another {0} players to go.->Kartengeberin: Seufz, mein heutiges Soll an unspielbaren Händen ist noch nicht erfüllt.@nEs fehlen noch {0} Spieler.
Fun fact: a major update takes around 1,000 hours of work from start to finish.->Schon gewusst? Ein großes Update benötigt von Anfang bis Ende etwa 1.000 Arbeitsstunden.
Fun fact: MC tracks the win rate of every deck matchup.->Schon gewusst? MC erfasst die Siegrate jeder Deck-Paarung.
Fun fact: MC's novice-investor admin traded stocks to cover the high server costs and ended up paying for three years.->Schon gewusst? Der MC-Administrator war Börsenneuling, handelte aber mit Aktien, um die hohen Serverkosten zu decken, und bezahlte so drei Jahre.
Fun fact: mygo is part of the “ygo” archetype too.->Schon gewusst? Auch mygo gehört zum „ygo“-Archetyp.
Fun fact: Shiti says he'll put updates off, but keeps updating anyway.->Schon gewusst? Shiti sagt, er werde Updates verschieben, veröffentlicht aber trotzdem immer neue.
Fun fact: the Duel Database has a link to MC's Taobao store.->Schon gewusst? Die Duell-Datenbank enthält einen Link zum Taobao-Shop von MC.
If you encounter a bug, save the replay and report it to the MC community. We'll fix it as soon as possible.->Wenn du einen Fehler findest, speichere das Replay und melde ihn der MC-Community.@nWir beheben ihn so schnell wie möglich.
If you see blank cards, you haven't downloaded the latest pre-release server patch.->Wenn du leere Karten siehst, hast du den neuesten Patch für den Vorabserver noch nicht heruntergeladen.
