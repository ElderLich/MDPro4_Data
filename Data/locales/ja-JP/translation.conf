Card dealer: Sigh, I still haven't met today's brick-hand quota. Another {0} players to go.->配牌姫：はあ、今日の手札事故ノルマがまだ終わってない。@nあと{0}人もいるのに。
Fun fact: Shiti says he'll put updates off, but keeps updating anyway.->豆知識：尸体さんは更新を先延ばしにすると言いながら、結局こまめに更新しています。
The card dealer thinks you're tired, so it's time to brick and take a break.->配牌姫はあなたがお疲れだと思ったようです。手札事故を起こして、ひと休みしましょう。
The saint took the card dealer out to eat. She got a stomachache and mixed up the god-hand and brick-hand player lists.->聖女に食事へ連れ出された配牌姫はお腹を壊し、@n神手札と事故手札を配るプレイヤーのリストを取り違えました。
In a corner nobody notices, the card dealer is quietly singing to herself.->誰も気に留めない片隅で、配牌姫がこっそり歌っています。
Fun fact: MC's novice-investor admin traded stocks to cover the high server costs and ended up paying for three years.->豆知識：投資初心者のMC管理者は高額なサーバー代を賄うために株取引を始め、結果として3年分の費用を賄いました。
If you think you've disconnected, enter /tip to ask the server for a reply. No reply means you've disconnected.->切断されたと思ったら、/tipと入力してサーバーに応答を求めてください。@n応答がなければ切断されています。
Fun fact: the Duel Database has a link to MC's Taobao store.->豆知識：デュエルデータベースにはMCのTaobaoショップへのリンクがあります。
Whatever Deck you face, don't insult other players. Insults are bad manners.->どんなデッキが相手でも、他のプレイヤーを罵ってはいけません。暴言はマナー違反です。
If you encounter a bug, save the replay and report it to the MC community. We'll fix it as soon as possible.->不具合を見つけたら、リプレイを保存してMCコミュニティに報告してください。@nできるだけ早く修正します。
If you see blank cards, you haven't downloaded the latest pre-release server patch.->空白のカードが表示される場合は、先行サーバーの最新パッチをまだダウンロードしていません。
The WeChat account “决斗暗网” shares top tournament Deck lists and downloads every week.->WeChat公式アカウント「决斗暗网」は、実物のカードを使う大会の上位デッキ構築とダウンロードを毎週配信しています。
Fun fact: mygo is part of the “ygo” archetype too.->豆知識：mygoも「ygo」カテゴリに属しています。
Fun fact: a major update takes around 1,000 hours of work from start to finish.->豆知識：大型アップデートには、準備から完了まで約1000時間の作業が必要です。
The card dealer likes giving lucky hands to duelists who are single.->配牌姫は、恋人のいないデュエリストに良い手札を配るのが好きです。
