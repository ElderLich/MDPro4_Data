Fun fact: a major update takes around 1,000 hours of work from start to finish.->Curiosità: un aggiornamento importante richiede circa 1.000 ore di lavoro dall’inizio alla fine.
Fun fact: MC tracks the win rate of every deck matchup.->Curiosità: MC registra la percentuale di vittorie di ogni abbinamento tra deck.
Fun fact: MC's novice-investor admin traded stocks to cover the high server costs and ended up paying for three years.->Curiosità: l’amministratore di MC, alle prime armi in Borsa, ha compravenduto azioni per coprire gli alti costi del server, finanziandone tre anni.
Fun fact: mygo is part of the “ygo” archetype too.->Curiosità: anche mygo fa parte dell’archetipo “ygo”.
Fun fact: Shiti says he'll put updates off, but keeps updating anyway.->Curiosità: Shiti dice che rimanderà gli aggiornamenti, ma continua comunque a pubblicarli.
Fun fact: the Duel Database has a link to MC's Taobao store.->Curiosità: il database dei duelli contiene un collegamento al negozio Taobao di MC.
If you encounter a bug, save the replay and report it to the MC community. We'll fix it as soon as possible.->Se riscontri un bug, salva il replay e segnalalo alla community di MC.@nLo correggeremo il prima possibile.
If you see blank cards, you haven't downloaded the latest pre-release server patch.->Se vedi carte vuote, non hai scaricato l’ultima patch del server di anteprima.
If you think you've disconnected, enter /tip to ask the server for a reply. No reply means you've disconnected.->Se pensi di esserti disconnesso, digita /tip per chiedere una risposta al server.@nNessuna risposta significa che sei disconnesso.
