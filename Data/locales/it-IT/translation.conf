Enter the Battle Phase and attack to trigger the opponent's Trap Card. This is a demonstration; exit when you have finished viewing it.->Entra nella Battle Phase e attacca per attivare la Carta Trappola dell’avversario. Questa è una dimostrazione: esci quando hai finito di guardarla.
Enter the Battle Phase and attack directly. Chain your Set Dominus Impulse to the opponent's Special Summon effect. Exit when you have finished viewing the demonstration.->Entra nella Battle Phase e attacca direttamente. Attiva il tuo «Impulso Dominus» Posizionato in Catena all’effetto di Evocazione Speciale dell’avversario. Esci quando hai finito di guardare la dimostrazione.
Activate your Set Side Effects? and let the opponent draw, then activate Droll & Lock Bird. Exit when you have finished viewing the demonstration.->Attiva il tuo «Effetti Collaterali?» Posizionato e lascia pescare l’avversario, poi attiva «Droll & Uccello Serratura». Esci quando hai finito di guardare la dimostrazione.
Activate Maxx "C", then chain Ghost Belle & Haunted Mansion to the opponent's Called by the Grave. Exit when you have finished viewing the demonstration.->Attiva «Maxx "C"», poi attiva «Bella Fantasma & Maniero Infestato» in Catena a «Richiamato dalla Tomba» dell’avversario. Esci quando hai finito di guardare la dimostrazione.
Normal Summon the monster in your hand, then chain the featured card to the opponent's Solemn Judgment. Exit when you have finished viewing the demonstration.->Evoca Normalmente il mostro nella tua mano, poi attiva la carta mostrata in Catena a «Giudizio Solenne» dell’avversario. Esci quando hai finito di guardare la dimostrazione.
Activate Maxx "C" and let the opponent respond with Ash Blossom & Joyous Spring. After the Chain resolves, activate Triple Tactics Talent. Exit when you have finished viewing the demonstration.->Attiva «Maxx "C"» e lascia rispondere l’avversario con «Fioritura di Cenere & Gioiosa Primavera». Dopo che la Catena si è risolta, attiva «Talento Tattiche Triple». Esci quando hai finito di guardare la dimostrazione.
Tribute two of your monsters to Normal Summon a monster from your hand. This is a summon demonstration; exit when you have finished viewing it.->Offri come Tributo due tuoi mostri per Evocare Normalmente un mostro dalla tua mano. Questa è una dimostrazione di Evocazione: esci quando hai finito di guardarla.
Enter the Battle Phase and win this turn by attacking with your Red-Eyes monsters.->Entra nella Battle Phase e vinci in questo turno attaccando con i tuoi mostri «Occhi Rossi».
Activate Raigeki to clear the opponent's monsters, then enter the Battle Phase and win this turn with a direct attack.->Attiva «Raigeki» per eliminare i mostri dell’avversario, poi entra nella Battle Phase e vinci in questo turno con un attacco diretto.
Activate Raigeki to clear the opponent's monsters, then attack directly with The Winged Dragon of Ra - Immortal Phoenix to win this turn.->Attiva «Raigeki» per eliminare i mostri dell’avversario, poi attacca direttamente con «Drago Alato di Ra - Fenice della Divinità Egizia» per vincere in questo turno.
Activate Crossout Designator and declare Crossout Designator. If asked to choose the opponent's declaration, select Forbidden Droplet. Exit when you have finished viewing the demonstration.->Attiva «Designatore del Depennamento» e dichiara «Designatore del Depennamento». Se ti viene chiesto di scegliere la dichiarazione dell’avversario, seleziona «Goccioline Proibite». Esci quando hai finito di guardare la dimostrazione.
