#SRVPro known notices and tips
Welcome to the MC pre-release server. Website: {0}. MC user group {1}: {2}. Fusion effect resolution is being repaired; please report any Fusion issues.->Benvenuto sul server di anteprima MC.@nSito: {0}.@nGruppo utenti MC {1}: {2}.@nLa risoluzione degli effetti di Fusione è in fase di correzione.@nSegnala eventuali problemi con le Fusioni.
The card dealer checked the forecast and decided today was a great day to brick.->La distributrice di carte ha controllato le previsioni e ha deciso che oggi è una giornata perfetta per una mano ingiocabile.
Fun fact: MC tracks the win rate of every deck matchup.->Curiosità: MC registra la percentuale di vittorie di ogni abbinamento tra deck.
The card dealer is full of energy today!->La distributrice di carte è piena di energia anche oggi!
Rumor has it the washing machine broke, so the card dealer kidnapped Little Blue…->Si dice che la lavatrice si sia rotta, così la distributrice di carte ha rapito Piccola Blu…
Card dealer: Hakimi Mambo~->Distributrice di carte: Hakimi Mambo~
To resume your interrupted duel, select the same unchanged deck you started with, then choose Ready.->Per riprendere il duello interrotto, seleziona lo stesso deck iniziale senza modificarlo, poi scegli Pronto.
To reconnect, select the exact same deck you used at the start of the interrupted duel.->Per riconnetterti, seleziona esattamente lo stesso deck usato all’inizio del duello interrotto.
Reconnecting to the server…->Riconnessione al server…
Reconnection failed.->Riconnessione non riuscita.
Your account connected from another device, so you were disconnected.->Il tuo account si è connesso da un altro dispositivo, quindi questa connessione è stata chiusa.
The card dealer looked at the card you just drew and became lost in thought.->La distributrice di carte ha guardato la carta che hai appena pescato e si è persa nei suoi pensieri.
Your draws have been so lucky lately that the card dealer put your Side Deck at the bottom of your Deck.->Ultimamente hai avuto così tanta fortuna nel pescare che la distributrice di carte ha messo il tuo Side Deck in fondo al tuo Deck.
Welcome to this server.->Benvenuto su questo server.
This server runs on MyCard server software.->Questo server utilizza il software server di MyCard.
MC user group {0}: {1}.->Gruppo utenti MC {0}: {1}.
In the past month, the card dealer activated annihilation mode {0} times.->Nell’ultimo mese, la distributrice di carte ha attivato la modalità annientamento {0} volte.
MC user group: {0}.->Gruppo utenti MC: {0}.
Card dealer: Sigh, I still haven't met today's brick-hand quota. Another {0} players to go.->Distributrice di carte: Uff, non ho ancora raggiunto la quota odierna di mani ingiocabili.@nMancano ancora {0} giocatori.
Fun fact: Shiti says he'll put updates off, but keeps updating anyway.->Curiosità: Shiti dice che rimanderà gli aggiornamenti, ma continua comunque a pubblicarli.
The card dealer thinks you're tired, so it's time to brick and take a break.->La distributrice di carte pensa che tu sia stanco: è ora di una mano ingiocabile e di una pausa.
The saint took the card dealer out to eat. She got a stomachache and mixed up the god-hand and brick-hand player lists.->La santa ha portato la distributrice di carte a mangiare fuori.@nUn mal di pancia le ha fatto confondere le liste dei giocatori con mani perfette e ingiocabili.
In a corner nobody notices, the card dealer is quietly singing to herself.->In un angolo che nessuno nota, la distributrice di carte canticchia tra sé e sé.
Fun fact: MC's novice-investor admin traded stocks to cover the high server costs and ended up paying for three years.->Curiosità: l’amministratore di MC, alle prime armi in Borsa, ha compravenduto azioni per coprire gli alti costi del server, finanziandone tre anni.
If you think you've disconnected, enter /tip to ask the server for a reply. No reply means you've disconnected.->Se pensi di esserti disconnesso, digita /tip per chiedere una risposta al server.@nNessuna risposta significa che sei disconnesso.
Fun fact: the Duel Database has a link to MC's Taobao store.->Curiosità: il database dei duelli contiene un collegamento al negozio Taobao di MC.
Whatever Deck you face, don't insult other players. Insults are bad manners.->Qualunque Deck tu affronti, non insultare gli altri giocatori. Gli insulti sono maleducazione.
If you encounter a bug, save the replay and report it to the MC community. We'll fix it as soon as possible.->Se riscontri un bug, salva il replay e segnalalo alla community di MC.@nLo correggeremo il prima possibile.
If you see blank cards, you haven't downloaded the latest pre-release server patch.->Se vedi carte vuote, non hai scaricato l’ultima patch del server di anteprima.
The WeChat account “决斗暗网” shares top tournament Deck lists and downloads every week.->L’account WeChat “决斗暗网” condivide ogni settimana liste e download dei Deck meglio piazzati nei tornei con carte fisiche.
Fun fact: mygo is part of the “ygo” archetype too.->Curiosità: anche mygo fa parte dell’archetipo “ygo”.
