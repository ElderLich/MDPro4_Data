#SRVPro known notices and tips
Welcome to the MC pre-release server. Website: {0}. MC user group {1}: {2}. Fusion effect resolution is being repaired; please report any Fusion issues.->Bienvenue sur le serveur de préversion MC.@nSite : {0}.@nGroupe MC n° {1} : {2}.@nLa résolution des effets de Fusion est en cours de correction.@nMerci de signaler tout problème de Fusion.
The card dealer checked the forecast and decided today was a great day to brick.->La distributrice de cartes a regardé la météo : c’est une belle journée pour avoir une main injouable.
Fun fact: MC tracks the win rate of every deck matchup.->Le saviez-vous ? MC calcule le taux de victoire de chaque confrontation entre decks.
The card dealer is full of energy today!->La distributrice de cartes déborde d’énergie aujourd’hui !
Rumor has it the washing machine broke, so the card dealer kidnapped Little Blue…->Il paraît que la machine à laver est tombée en panne, alors la distributrice de cartes a enlevé Petite Bleue…
Card dealer: Hakimi Mambo~->La distributrice de cartes : Hakimi Mambo~
To resume your interrupted duel, select the same unchanged deck you started with, then choose Ready.->Pour reprendre le duel interrompu, sélectionnez le même deck qu’au début, sans aucune modification, puis choisissez Prêt.
To reconnect, select the exact same deck you used at the start of the interrupted duel.->Pour vous reconnecter, sélectionnez exactement le même deck qu’au début du duel interrompu.
Reconnecting to the server…->Reconnexion au serveur…
Reconnection failed.->Échec de la reconnexion.
Your account connected from another device, so you were disconnected.->Votre compte s’est connecté depuis un autre appareil. Cette connexion a donc été fermée.
The card dealer looked at the card you just drew and became lost in thought.->La distributrice de cartes a regardé la carte que tu viens de piocher et s’est perdue dans ses pensées.
Your draws have been so lucky lately that the card dealer put your Side Deck at the bottom of your Deck.->Tes pioches sont si chanceuses ces derniers temps que la distributrice de cartes a mis ton Side Deck tout au fond de ton Deck.
Welcome to this server.->Bienvenue sur ce serveur.
This server runs on MyCard server software.->Ce serveur utilise le logiciel serveur MyCard.
MC user group {0}: {1}.->Groupe d’utilisateurs MC n° {0} : {1}.
In the past month, the card dealer activated annihilation mode {0} times.->Au cours du mois écoulé, la distributrice de cartes a activé le mode annihilation {0} fois.
MC user group: {0}.->Groupe d’utilisateurs MC : {0}.
Card dealer: Sigh, I still haven't met today's brick-hand quota. Another {0} players to go.->Distributrice de cartes : Pff, je n’ai pas encore atteint mon quota de mains injouables du jour.@nIl me reste {0} joueurs.
Fun fact: Shiti says he'll put updates off, but keeps updating anyway.->Le saviez-vous ? Shiti dit qu’il va reporter les mises à jour, mais continue quand même à en faire.
The card dealer thinks you're tired, so it's time to brick and take a break.->La distributrice de cartes vous trouve fatigué : une main injouable et une pause s’imposent.
The saint took the card dealer out to eat. She got a stomachache and mixed up the god-hand and brick-hand player lists.->La sainte a emmené la distributrice de cartes manger.@nUn mal de ventre lui a fait confondre les listes de joueurs aux mains parfaites et injouables.
In a corner nobody notices, the card dealer is quietly singing to herself.->Dans un coin où personne ne regarde, la distributrice de cartes chante discrètement pour elle-même.
Fun fact: MC's novice-investor admin traded stocks to cover the high server costs and ended up paying for three years.->Le saviez-vous ? L’administrateur MC, novice en Bourse, a négocié des actions pour couvrir les frais élevés du serveur et a fini par financer trois ans.
If you think you've disconnected, enter /tip to ask the server for a reply. No reply means you've disconnected.->Si vous pensez être déconnecté, saisissez /tip pour demander une réponse au serveur.@nL’absence de réponse signifie que vous êtes déconnecté.
Fun fact: the Duel Database has a link to MC's Taobao store.->Le saviez-vous ? La base de données de duels propose un lien vers la boutique Taobao de MC.
Whatever Deck you face, don't insult other players. Insults are bad manners.->Quel que soit le Deck adverse, n’insultez pas les autres joueurs. Les insultes sont un manque de savoir-vivre.
If you encounter a bug, save the replay and report it to the MC community. We'll fix it as soon as possible.->Si vous rencontrez un bug, sauvegardez le replay et signalez-le à la communauté MC.@nNous le corrigerons dès que possible.
If you see blank cards, you haven't downloaded the latest pre-release server patch.->Si vous voyez des cartes vierges, vous n’avez pas téléchargé le dernier correctif du serveur de préversion.
The WeChat account “决斗暗网” shares top tournament Deck lists and downloads every week.->Le compte WeChat « 决斗暗网 » partage chaque semaine des listes de Decks primés en tournois physiques et leurs téléchargements.
Fun fact: mygo is part of the “ygo” archetype too.->Le saviez-vous ? mygo fait aussi partie de l’archétype « ygo ».
