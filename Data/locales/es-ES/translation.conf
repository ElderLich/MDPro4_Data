#SRVPro known notices and tips
Welcome to the MC pre-release server. Website: {0}. MC user group {1}: {2}. Fusion effect resolution is being repaired; please report any Fusion issues.->Te damos la bienvenida al servidor preliminar de MC.@nSitio web: {0}.@nGrupo de usuarios de MC {1}: {2}.@nSe está corrigiendo la resolución de los efectos de Fusión.@nInforma de cualquier problema con las Fusiones.
The card dealer checked the forecast and decided today was a great day to brick.->La repartidora de cartas ha mirado el pronóstico y ha decidido que hoy es un gran día para una mano injugable.
Fun fact: MC tracks the win rate of every deck matchup.->Dato curioso: MC registra el porcentaje de victorias de cada enfrentamiento entre decks.
The card dealer is full of energy today!->¡La repartidora de cartas está llena de energía hoy!
Rumor has it the washing machine broke, so the card dealer kidnapped Little Blue…->Dicen que se estropeó la lavadora, así que la repartidora de cartas secuestró a Pequeña Azul…
Card dealer: Hakimi Mambo~->Repartidora de cartas: Hakimi Mambo~
To resume your interrupted duel, select the same unchanged deck you started with, then choose Ready.->Para reanudar el duelo interrumpido, selecciona el mismo deck inicial sin modificarlo y elige Listo.
To reconnect, select the exact same deck you used at the start of the interrupted duel.->Para reconectarte, selecciona exactamente el mismo deck que usaste al comienzo del duelo interrumpido.
Reconnecting to the server…->Reconectando con el servidor…
Reconnection failed.->No se pudo restablecer la conexión.
Your account connected from another device, so you were disconnected.->Tu cuenta se ha conectado desde otro dispositivo, por lo que se ha cerrado esta conexión.
The card dealer looked at the card you just drew and became lost in thought.->La repartidora de cartas miró la carta que acabas de robar y se quedó pensativa.
Your draws have been so lucky lately that the card dealer put your Side Deck at the bottom of your Deck.->Últimamente has tenido tanta suerte al robar que la repartidora de cartas ha puesto tu Side Deck al fondo de tu Deck.
Welcome to this server.->Te damos la bienvenida a este servidor.
This server runs on MyCard server software.->Este servidor utiliza el software de servidor de MyCard.
MC user group {0}: {1}.->Grupo de usuarios de MC {0}: {1}.
In the past month, the card dealer activated annihilation mode {0} times.->Durante el último mes, la repartidora de cartas activó el modo de aniquilación {0} veces.
MC user group: {0}.->Grupo de usuarios de MC: {0}.
Card dealer: Sigh, I still haven't met today's brick-hand quota. Another {0} players to go.->Repartidora de cartas: Ay, aún no he cumplido la cuota de manos injugables de hoy.@nFaltan otros {0} jugadores.
Fun fact: Shiti says he'll put updates off, but keeps updating anyway.->Dato curioso: Shiti dice que va a posponer las actualizaciones, pero sigue publicándolas de todos modos.
The card dealer thinks you're tired, so it's time to brick and take a break.->La repartidora de cartas cree que estás cansado: toca una mano injugable y un descanso.
The saint took the card dealer out to eat. She got a stomachache and mixed up the god-hand and brick-hand player lists.->La santa llevó a comer a la repartidora de cartas.@nLe dolió el estómago y confundió las listas de jugadores con manos perfectas e injugables.
In a corner nobody notices, the card dealer is quietly singing to herself.->En un rincón donde nadie se fija, la repartidora de cartas canta bajito para sí misma.
Fun fact: MC's novice-investor admin traded stocks to cover the high server costs and ended up paying for three years.->Dato curioso: el administrador de MC, novato en bolsa, negoció acciones para cubrir los altos costes del servidor y acabó pagando tres años.
If you think you've disconnected, enter /tip to ask the server for a reply. No reply means you've disconnected.->Si crees que te has desconectado, escribe /tip para pedir una respuesta al servidor.@nSi no responde, estás desconectado.
Fun fact: the Duel Database has a link to MC's Taobao store.->Dato curioso: la base de datos de duelos tiene un enlace a la tienda de MC en Taobao.
Whatever Deck you face, don't insult other players. Insults are bad manners.->Da igual el Deck al que te enfrentes: no insultes a otros jugadores. Insultar es de mala educación.
If you encounter a bug, save the replay and report it to the MC community. We'll fix it as soon as possible.->Si encuentras un error, guarda la repetición e informa a la comunidad de MC.@nLo corregiremos lo antes posible.
If you see blank cards, you haven't downloaded the latest pre-release server patch.->Si ves cartas en blanco, no has descargado el último parche del servidor preliminar.
The WeChat account “决斗暗网” shares top tournament Deck lists and downloads every week.->La cuenta de WeChat «决斗暗网» comparte cada semana listas y descargas de los Decks mejor clasificados en torneos con cartas físicas.
